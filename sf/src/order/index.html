<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>訂單已提交 | 萬寧 MANNINGS</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{margin:0;background:#f6f7f9;color:#1f2328;font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",system-ui,Arial,sans-serif}
  .card{max-width:560px;margin:48px auto;background:#fff;border-radius:16px;padding:28px;text-align:center}
  h1{font-size:22px;margin:8px 0}
  .no{color:#8b93a1;font-size:13px}
  .st{display:inline-block;margin:14px 0;padding:6px 14px;border-radius:999px;font-weight:800;font-size:13px;background:#fff4e6;color:#ff8300}
  .ok{background:#e8f7ee;color:#12a150}
  .btn{display:inline-block;margin-top:16px;height:46px;line-height:46px;padding:0 26px;border-radius:999px;background:#ff8300;color:#fff;font-weight:900;text-decoration:none}
  .tip{color:#475569;font-size:13px;margin-top:10px;line-height:1.8}
  footer{text-align:center;color:#8b93a1;font-size:12px;padding:18px}
</style>
</head>
<body>
<div class="card">
  <div style="font-size:44px">🧾</div>
  <h1 id="title">訂單已提交</h1>
  <div class="no">訂單編號：<b id="no">—</b></div>
  <div class="st" id="status">等待付款確認…</div>
  <div class="tip" id="tip">我們正在確認你的付款，確認後會即時發送確認電郵。全單免運費，下午 4 點前落單當日送達。</div>
  <a class="btn" href="/">繼續購物</a>
</div>
<footer>© 2026 萬寧 All rights reserved.</footer>
<script>
(function(){
  var no = decodeURIComponent(location.pathname.split('/').pop() || '');
  document.getElementById('no').textContent = no || '—';
  var st = document.getElementById('status');
  function poll(){
    fetch('/api/order/' + encodeURIComponent(no), {credentials:'same-origin', cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (j && (j.status === 'created' || j.status === 'paid' || j.status === 'success')) {
          st.textContent = '付款成功，訂單已確認';
          st.className = 'st ok';
          document.getElementById('title').textContent = '付款成功';
        } else {
          st.textContent = '等待付款確認…';
          setTimeout(poll, 3000);
        }
      })
      .catch(function(){ setTimeout(poll, 5000); });
  }
  if (no) poll();
})();
</script>
</body>
</html>
